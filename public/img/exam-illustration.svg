<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9ecf5"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2173f"/>
      <stop offset="100%" stop-color="#8e0b20"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2440a8"/>
      <stop offset="100%" stop-color="#0a0e2a"/>
    </linearGradient>
  </defs>

  <circle cx="240" cy="240" r="220" fill="rgba(255,255,255,0.06)"/>
  <circle cx="240" cy="240" r="175" fill="rgba(255,255,255,0.05)"/>

  <!-- Clipboard -->
  <g transform="translate(120,70)">
    <rect x="0" y="20" width="200" height="280" rx="16" fill="url(#cardGrad)"/>
    <rect x="60" y="0" width="80" height="34" rx="10" fill="url(#redGrad)"/>
    <rect x="24" y="64" width="152" height="14" rx="7" fill="#cfd6ee"/>
    <rect x="24" y="92" width="110" height="10" rx="5" fill="#dfe4f4"/>

    <!-- checklist items -->
    <g>
      <circle cx="36" cy="132" r="12" fill="url(#blueGrad)"/>
      <path d="M30 132l5 5 9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="58" y="126" width="118" height="12" rx="6" fill="#c7cee8"/>
    </g>
    <g>
      <circle cx="36" cy="168" r="12" fill="url(#redGrad)"/>
      <path d="M30 168l5 5 9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="58" y="162" width="118" height="12" rx="6" fill="#c7cee8"/>
    </g>
    <g>
      <circle cx="36" cy="204" r="12" fill="url(#blueGrad)"/>
      <path d="M30 204l5 5 9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="58" y="198" width="90" height="12" rx="6" fill="#c7cee8"/>
    </g>

    <!-- QR code block -->
    <rect x="24" y="232" width="60" height="60" rx="8" fill="#0a0e2a"/>
    <g fill="#ffffff">
      <rect x="32" y="240" width="10" height="10"/>
      <rect x="48" y="240" width="10" height="10"/>
      <rect x="32" y="256" width="10" height="10"/>
      <rect x="64" y="240" width="10" height="10"/>
      <rect x="48" y="272" width="10" height="10"/>
      <rect x="64" y="264" width="10" height="10"/>
    </g>
    <rect x="100" y="240" width="76" height="10" rx="5" fill="#dfe4f4"/>
    <rect x="100" y="258" width="60" height="10" rx="5" fill="#dfe4f4"/>
    <rect x="100" y="276" width="68" height="10" rx="5" fill="#dfe4f4"/>
  </g>

  <!-- floating badge -->
  <g transform="translate(305,255)">
    <circle cx="0" cy="0" r="34" fill="url(#redGrad)"/>
    <path d="M-12 0l8 8 16-18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- small dots -->
  <circle cx="105" cy="350" r="6" fill="#ffffff" opacity="0.5"/>
  <circle cx="370" cy="120" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="95" cy="110" r="4" fill="#ffffff" opacity="0.4"/>
</svg>
